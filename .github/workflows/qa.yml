name: QA Automation Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qa:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >
          --health-cmd "mongo --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install backend dependencies
        run: npm install --prefix backend

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Start backend server
        run: |
          echo "MONGODB_URI=mongodb://localhost:27017/buspass" > backend/.env
          echo "JWT_SECRET=test-secret" >> backend/.env
          cd backend
          nohup npm start &>/tmp/backend.log &
          cd ..
          sleep 10

      - name: Start frontend server
        run: |
          cd frontend
          nohup npm run dev -- --host 0.0.0.0 --port 5173 &>/tmp/frontend.log &
          cd ..
          sleep 10

      - name: Run QA suite
        run: |
          mkdir -p reports
          python -m pytest --html=reports/full_audit_report.html --self-contained-html
